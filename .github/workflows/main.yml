name: Build Tweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup iOS SDK and Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y perl clang make git rsync curl
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          # 💡 黄金级修复：切换为可以直接裸下解压的纯净版 iOS 14.5 SDK（对 iOS 16 无根完全通用且包体极小）
          mkdir -p $HOME/theos/sdks
          curl -LO https://github.com/xybp888/iOS-SDKs/raw/master/iPhoneOS14.5.sdk.tar.xz
          tar -xf iPhoneOS14.5.sdk.tar.xz -C $HOME/theos/sdks
          rm iPhoneOS14.5.sdk.tar.xz

      - name: Compile and Package
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
        
      - name: Upload 成品 DEB 大包
        uses: actions/upload-artifact@v4
        with:
          name: universalhijack_rootless_deb
          path: packages/*.deb
