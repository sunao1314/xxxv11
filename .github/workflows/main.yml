name: Build Tweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      # 💡 核心修复：不用第三方插件，直接用 Linux 原生命令秒装 Theos 依赖
      - name: Setup iOS SDK and Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y perl clang make git rsync curl
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          # 下载最新的 iOS 16.5 纯血无根精简版 SDK（确保无根环境下完美编译）
          mkdir -p $HOME/theos/sdks
          curl -LO https://github.com/theos/sdks/raw/master/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C $HOME/theos/sdks
          rm iPhoneOS16.5.sdk.tar.xz

      - name: Compile and Package
        run: |
          # 声明环境变量，告诉 make 去哪里找底座
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
        
      - name: Upload 成品 DEB 大包
        uses: actions/upload-artifact@v4
        with:
          name: universalhijack_rootless_deb
          path: packages/*.deb
